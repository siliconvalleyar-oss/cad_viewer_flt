name: cad_viewer
description: "CAD Viewer & Editor — multiplataforma para visualizar y editar archivos DXF/DWG (AutoCAD y LibreCAD)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Parsing DXF (null-safety; la v1.x documentada no soporta null safety)
  # State management
  provider: ^6.1.1
  # File access / storage
  file_picker: ^10.3.10
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4
  path: ^1.9.0
  collection: ^1.18.0
  # Export / share
  screenshot: ^3.0.0
  # Assets / icons
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
